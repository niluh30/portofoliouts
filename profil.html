
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Profil - Niuhh</title>

    <link rel="stylesheet" href="css/bootstrap-grid.css">
    <link rel="stylesheet" href="css/styles.css">

    <link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #fff0f4, #ffe4ec, #fff8f5);
            color: #a65f7b;
        }

        .no-sticky nav {
            position: static;
        }

        .profile-form-section {
            min-height: 85vh;
            padding: 70px 20px;
        }

        .form-card {
            max-width: 650px;
            margin: 30px auto;
            padding: 35px;
            background: rgba(255,255,255,0.85);
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(190,110,140,0.15);
        }

        .form-card h1 {
            text-align: center;
            color: #bd718e;
        }

        .form-card p {
            text-align: center;
            color: #a77787;
        }

        .form-card ul {
            list-style: none;
            padding: 0;
        }

        .form-card li {
            margin-bottom: 18px;
        }

        .form-card label {
            display: block;
            margin-bottom: 8px;
            color: #a65f7b;
        }

        .form-card input,
        .form-card textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #edc4d2;
            border-radius: 12px;
            background: #fff9fb;
            color: #87576a;
            font-family: inherit;
            box-sizing: border-box;
        }

        .form-card input:focus,
        .form-card textarea:focus {
            outline: none;
            border-color: #cf829e;
            box-shadow: 0 0 8px #f5d3df;
        }

        .form-card button {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: #d58ba4;
            color: white;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
        }

        .form-card button:hover {
            background: #b96885;
            transform: translateY(-3px);
        }

        .form-card .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #b96885;
        }

        @media(max-width: 600px) {
            .form-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body class="no-sticky">

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="profil.html">Profil</a></li>
            <li>
                <a href="https://www.instagram.com/iilluhhh_/"
                   target="_blank">Instagram</a>
            </li>
        </ul>
    </nav>

    <section class="profile-form-section">
        <div class="form-card">

            <h1>frofile Niluhh ♡</h1>
            <p>Welcome to my little world. Please fill in your profile ✿</p>

            <form id="profilForm">

                <ul>
                    <li>
                        <label for="nim">NIM</label>
                        <input type="text" id="nim" required
                               placeholder="Masukkan NIM">
                    </li>

                    <li>
                        <label for="nama">Nama Lengkap</label>
                        <input type="text" id="nama" required
                               placeholder="Masukkan nama lengkap">
                    </li>

                    <li>
                        <label for="alamat">Alamat</label>
                        <textarea id="alamat" rows="3" required
                                  placeholder="Masukkan alamat"></textarea>
                    </li>

                    <li>
                        <label for="hobi">Hobi</label>
                        <input type="text" id="hobi" required
                               placeholder="Masukkan hobi">
                    </li>

                    <li>
                        <label for="instagram">Instagram</label>
                        <input type="text" id="instagram" required
                               placeholder="@username">
                    </li>
                </ul>

                <button type="submit">Simpan Profil ♡</button>

            </form>

            <a href="profil-tersimpan.html" class="back-link">
                Lihat Profil Tersimpan ✿
            </a>

        </div>
    </section>

    <footer>
        <h3>Made with love ♡</h3>
        <p>Designed & developed by Niuhh</p>
    </footer>

    <script>
        const form = document.getElementById("profilForm");

        // Tampilkan data lama jika ingin mengedit
        const dataLama = localStorage.getItem("profilNiuhh");

        if (dataLama) {
            try {
                const data = JSON.parse(dataLama);

                document.getElementById("nim").value = data.nim || "";
                document.getElementById("nama").value = data.nama || "";
                document.getElementById("alamat").value = data.alamat || "";
                document.getElementById("hobi").value = data.hobi || "";
                document.getElementById("instagram").value = data.instagram || "";
            } catch (error) {
                console.error("Data profil tidak dapat dibaca.");
            }
        }

        // SIMPAN DATA
        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const profil = {
                nim: document.getElementById("nim").value.trim(),
                nama: document.getElementById("nama").value.trim(),
                alamat: document.getElementById("alamat").value.trim(),
                hobi: document.getElementById("hobi").value.trim(),
                instagram: document.getElementById("instagram").value.trim()
            };

            try {
                localStorage.setItem(
                    "profilNiuhh",
                    JSON.stringify(profil)
                );

                alert("Yeay! Profil kamu berhasil disimpan ♡");

                window.location.href = "profil-tersimpan.html";

            } catch (error) {
                alert("Maaf, profil gagal disimpan. Coba lagi.");
                console.error(error);
            }
        });
    </script>

</body>
</html>
